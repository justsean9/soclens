[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soclens"
version = "2.3.2"
description = "SOCLens — Cross-platform SOC investigation workbench (TUI & CLI) for Recorded Future, Splunk, SentinelOne, Sigma, and Local LLM"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Sean (justsean9)" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pysigma>=0.11.0",
    "pysigma-backend-splunk>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "diskcache>=5.6.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "urllib3>=2.0.0",
    "certifi>=2023.7.0",
    "charset-normalizer>=3.2.0",
    "idna>=3.4",
    "packaging>=23.0",
    "pyparsing>=3.0.0",
    "soupsieve>=2.5.0",
    "typing-extensions>=4.7.0",
    "textual>=0.80.0",
    "rich>=13.7.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
soclens = "soclens.cli:main"

[project.urls]
Homepage = "https://github.com/justsean9/soclens"
Repository = "https://github.com/justsean9/soclens"
Issues = "https://github.com/justsean9/soclens/issues"
Changelog = "https://github.com/justsean9/soclens/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["soclens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "e2e: End-to-end tests using local mock servers and fixtures",
    "tier1: Tier 1 happy-path E2E tests",
    "tier2: Tier 2 boundary and error-handling E2E tests",
    "tier3: Tier 3 pairwise cross-feature E2E tests",
    "tier4: Tier 4 full SOC scenario E2E tests",
    "feature(name): Feature ID tag for requirement traceability",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

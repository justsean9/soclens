name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify offline wheelhouse
        run: python scripts/build_wheelhouse.py --verify

      - name: Resolve version and validate against pyproject.toml
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) does not match pyproject.toml version ($PKG_VERSION)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify offline release bundles
        run: |
          python scripts/build_release_bundles.py --version "${{ steps.meta.outputs.version }}"
          python scripts/build_release_bundles.py --verify --version "${{ steps.meta.outputs.version }}"

      - name: Generate release notes
        run: |
          python - "${{ steps.meta.outputs.version }}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog)
          notes_parts = []
          if match:
              body = match.group(1).strip()
              if body:
                  notes_parts.append(f"## What's Changed in v{version}\n\n{body}")

          bundle_readme = Path(f"bundles/v{version}/README.md").read_text(encoding="utf-8")
          notes_parts.append(bundle_readme.strip())
          Path("/tmp/release_notes.md").write_text("\n\n---\n\n".join(notes_parts) + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "bundles/v${VERSION}/soclens-v${VERSION}-offline-"*.zip \
              "bundles/v${VERSION}/SHA256SUMS.txt" \
              --clobber
            gh release edit "$TAG" --title "SOCLens $TAG" --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG" \
              "bundles/v${VERSION}/soclens-v${VERSION}-offline-"*.zip \
              "bundles/v${VERSION}/SHA256SUMS.txt" \
              --title "SOCLens $TAG" \
              --notes-file /tmp/release_notes.md
          fi
